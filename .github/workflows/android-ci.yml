name: android-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ASHURA_android_dev/ASHURA_Tutor
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle user home and build cache. The Gradle version is pinned by the
      # committed wrapper, so CI uses exactly the same Gradle as a local build.
      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      # The ubuntu-latest image ships the Android SDK (ANDROID_HOME) and accepts its licences.
      # android-actions/setup-android is intentionally not used: v3 still runs
      # "sdkmanager tools", a package that has been removed from the SDK repository.
      - name: Show Android SDK location
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true

      - name: Unit tests, lint and debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ashura-tutor-debug-apk
          path: ASHURA_android_dev/ASHURA_Tutor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: ASHURA_android_dev/ASHURA_Tutor/app/build/reports
          if-no-files-found: warn
