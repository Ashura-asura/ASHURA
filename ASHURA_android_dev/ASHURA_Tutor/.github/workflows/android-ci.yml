name: android-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle user home and the build cache. The Gradle version itself is pinned by
      # the committed wrapper (gradle/wrapper/gradle-wrapper.properties), so CI uses exactly the
      # same Gradle as a local build.
      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Unit tests, lint and debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ashura-tutor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
          if-no-files-found: warn
