<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASHURA</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">A</span>
        <div>
          <h1>ASHURA</h1>
          <p>local cognitive runtime</p>
        </div>
      </div>

      <section class="panel">
        <h2>Status</h2>
        <div id="status" class="status-grid">
          <p class="muted">connecting…</p>
        </div>
      </section>

      <section class="panel grow">
        <h2>Memory</h2>
        <div class="search-row">
          <input id="memory-query" type="search" placeholder="Search memories" autocomplete="off">
          <button id="memory-search" type="button">Search</button>
        </div>
        <div id="memory-results" class="memory-list">
          <p class="muted">Recent admissions appear here.</p>
        </div>
      </section>

      <footer>localhost only · no external API</footer>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2>Ask ASHURA</h2>
          <p id="model-label" class="muted">loading model…</p>
        </div>
        <label class="toggle">
          <input type="checkbox" id="show-trace" checked>
          <span>show trace</span>
        </label>
      </header>

      <section id="chat" class="chat" aria-live="polite">
        <div class="empty-state">
          <div class="empty-mark">A</div>
          <h3>Local reasoning, measured.</h3>
          <p>Ask a question, test a correction, or upload an image for OCR. Nothing leaves this machine.</p>
        </div>
      </section>

      <form id="composer" class="composer">
        <textarea id="message" rows="2" placeholder="Ask a question…" autocomplete="off"></textarea>
        <div class="composer-actions">
          <label class="upload" title="Run local OCR on an image">
            OCR image
            <input id="ocr-file" type="file" accept="image/*" hidden>
          </label>
          <button type="submit" id="send">Send</button>
        </div>
      </form>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
