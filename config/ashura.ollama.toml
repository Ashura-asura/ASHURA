# ASHURA configuration. Values marked TBD must be filled after Phase 0 measurements.

[foundation]
backend = "ollama"             # "echo" (test stub) | "llama_cpp" | "ollama"
family = "qwen2"               # `ollama show tony:7b-gpa3`
checkpoint = "tony:7b-gpa3"
quantization = "Q4_K_M"        # from `ollama show tony:7b-gpa3`
licence = "Local fine-tune of Qwen2 (Apache-2.0 base); user-supplied bio/curriculum data; provenance unverified"
path = ""                      # local .gguf path (not committed)
sha256 = ""                    # pinned hash of the stable checkpoint
n_ctx = 4096                   # EXP-018 used 4096; model supports 32768
max_tokens = 1024              # leave room for complete explanations and derivations
n_threads = 4                  # i7-1165G7: 4 cores / 8 threads
# --- backend = "ollama" (see config/ashura.ollama.toml for a ready-made example) ---
model = "tony:7b-gpa3"         # general tutor: 41/42 adjudicated, 1.86 s p50 (EXP-018)
host = "http://127.0.0.1:11434"
digest = "2a86766287cf"        # ID column of `ollama list`; pins the exact weights (mismatch => refuse to run)
keep_alive = "10m"
top_p = 0.9                    # pinned; greedy decoding still uses temperature 0 and seed 0
think = false                  # fast response path; tony:7b-gpa3 has no thinking capability
# Client-side concurrency policy (F-047). The Ollama server owns the real slots: use
# OLLAMA_NUM_PARALLEL=1 (safe default) or 2 (opt-in concurrent maximum) before starting
# `ollama serve`; EXP-019 rejects 4 on this laptop. `max_inflight` caps this one ASHURA process;
# `max_queue` bounds requests waiting for a slot; a full/timeout queue fails fast instead of
# growing without limit.
max_inflight = 1               # per process; keep at 1 unless the server has spare parallel slots
max_queue = 8
queue_timeout_s = 60

[memory]
db_path = "data/ashura.db"
working_memory_slots = 8
working_memory_ttl_s = 600

[ama]
# Experimental weights. NOT calibrated yet (see research/hypotheses.md H-AMA).
w_novelty = 1.0
w_surprise = 0.5
w_reliability = 1.0
w_utility = 0.7
w_conflict = 0.8
w_cost = 0.3
discard_threshold = 0.45
duplicate_similarity = 0.9
reliable_fact_threshold = 0.8
retrieval_min_reliability = 0.5   # below this (unverified model output = 0.2) is not retrieval evidence

[nfd]
# Experimental weights for P = aE + bU + cR + dI - eK. NOT calibrated yet.
a_error = 1.0
b_uncertainty = 0.6
c_recurrence = 0.5
d_importance = 1.0
e_cost = 0.8
activation_threshold = 0.25
ram_headroom_mb = 1500
cpu_busy_percent = 85          # optional heavy modules are deferred above this system-wide CPU load
heavy_latency_ms = 500

[agent]
# Local agentic tools and task-aware generation budgets. Tools are read-only workspace
# observations plus a sandboxed write_note; they never execute shell commands.
enabled = true
max_answer_tokens = 1024
long_answer_tokens = 3072      # bounded again by the model's remaining context window
max_continuations = 2          # continue a length-truncated answer from where it stopped
max_tool_rounds = 3

[web]
# Server-side web research. Search runs in this process; the browser CSP keeps
# connect-src 'self'. Results are candidate evidence, never verified facts.
enabled = true
provider = "duckduckgo"        # duckduckgo | wikipedia | searxng
searx_url = ""                 # required for provider = "searxng"
timeout_s = 15.0
max_results = 5
max_fetch_pages = 2
max_page_chars = 3500
auto_on_uncertainty = true     # visible "Web check" after the model reports uncertainty
facts_db = "data/web_facts.db"
dataset_dir = "data/web_training"

[ui]
# The persistent token is a local secret; data/ is git-ignored and never served by the server.
persist_token = true
# token_file = "data/web_token"
# sessions_db = "data/ui_sessions.db"

[ngr]
# Tolerances are fixed BEFORE evaluation (spec section 11.3).
default_epsilon = 0.02
min_target_gain = 0.05
critical_epsilon = 0.0

[retention]
# Forgetting policy (memory/retention.py). Only unverified, never-reinforced, unrelated records are ever forgotten.
max_age_days = 30
max_rows = 0                   # 0 = no cap

[learning]
# Opt-in durable background learning (F-045). Disabled by default: enabling it requires a frozen
# replay corpus, a stable checkpoint and an explicit hard-timeout decision.
enabled = false
jobs_db = "data/learning_jobs.db"
max_queue = 8
hard_timeout_s = 0             # 0 = in-process (no kill); >0 = spawned child killed at the deadline
replay_path = ""               # JSONL ReplayItem records; required when enabled
checkpoint_dir = "checkpoints"
target = "corrected"
dim = 128
min_train = 4
min_target_gain = 0.05
initialization = "stable"      # "fresh" is valid when no stable checkpoint exists
# cold_start_checkpoint = ""
