[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashura"
version = "0.1.0"
description = "ASHURA - a local cognitive learning architecture (research prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
browser = ["playwright>=1.40", "Pillow>=10"]
llm = ["llama-cpp-python"]
brainsim = ["torch", "pytest>=7"]
perception = ["Pillow", "pytesseract"]
documents = ["pypdf>=4", "PyMuPDF>=1.24"]

[project.scripts]
ashura = "app.main:main"
ashura-web = "app.web:main"

# Flat layout with many top-level folders: list the importable packages explicitly, otherwise
# `pip install -e .` fails with "Multiple top-level packages discovered".
[tool.setuptools.packages.find]
include = ["app*", "brain*", "evaluation*", "evolution*", "foundation*", "learning*", "memory*",
           "plasticity*", "skills*"]

[tool.setuptools.package-data]
memory = ["schema.sql"]
app = ["static/*", "static/css/*", "static/js/*", "static/js/views/*", "static/vendor/katex/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
