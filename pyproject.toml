[project]
name = "ashura"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["psutil", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]
llm = ["llama-cpp-python"]
brainsim = ["torch"]
perception = ["Pillow", "pytesseract"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
